<div class="client-form">
  <h2>{{ id ? 'Modifier' : 'Ajouter' }} Client</h2>
  <form (ngSubmit)="save()">
    <div>
      <label for="nom">Nom</label>
      <input type="text" id="nom" [(ngModel)]="client.nom" name="nom" required>
    </div>
    <div>
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" [(ngModel)]="client.prenom" name="prenom" required>
    </div>
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="client.email" name="email" required>
    </div>
    <div>
      <label for="telephone">Téléphone</label>
      <input type="text" id="telephone" [(ngModel)]="client.telephone" name="telephone" required>
    </div>
    <div>
      <label for="adresse">Adresse</label>
      <input type="text" id="adresse" [(ngModel)]="client.adresse" name="adresse" required>
    </div>
    <button type="submit">Sauvegarder</button>
  </form>
</div>
