server:
  port: 8081

spring:
  # Configuration de la base de données (H2)
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: "1234"
    driver-class-name: org.h2.Driver
  
  # Console H2 pour visualiser vos données
  h2:
    console:
      enabled: true
      path: /h2-console

  # Configuration JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update # 'update' est souvent préférable à 'create' pour ne pas perdre les données à chaque reload
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Stratégie de matching (nécessaire pour Swagger/SpringDoc avec certaines versions de Boot)
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

# Configuration de Swagger UI / OpenAPI
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Vos paramètres personnalisés pour JWT
jwt:
  secret: "EgaBankSecretKeyForSecurityAndJwtTokenValidation2026"
  expiration: 86400000 # 24 heures